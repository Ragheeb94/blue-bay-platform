<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E90FF"/>
      <stop offset="100%" stop-color="#0A2463"/>
    </radialGradient>
    <clipPath id="circle">
      <circle cx="60" cy="60" r="55"/>
    </clipPath>
  </defs>

  <!-- Outer ring -->
  <circle cx="60" cy="60" r="58" fill="#0A2463"/>
  <circle cx="60" cy="60" r="55" fill="url(#bg)"/>

  <!-- Sky -->
  <rect x="5" y="5" width="110" height="55" fill="#87CEEB" clip-path="url(#circle)"/>

  <!-- Sun -->
  <circle cx="88" cy="30" r="12" fill="#FFD700"/>
  <circle cx="88" cy="30" r="9" fill="#FFA500"/>

  <!-- Hills -->
  <ellipse cx="30" cy="75" rx="40" ry="25" fill="#2E8B57" clip-path="url(#circle)"/>
  <ellipse cx="85" cy="80" rx="38" ry="20" fill="#3CB371" clip-path="url(#circle)"/>

  <!-- Water / Bay -->
  <ellipse cx="60" cy="90" rx="55" ry="22" fill="#1E90FF" clip-path="url(#circle)"/>
  <ellipse cx="60" cy="90" rx="55" ry="18" fill="#4169E1" opacity="0.7" clip-path="url(#circle)"/>

  <!-- Winding path/road -->
  <path d="M 45 115 Q 50 90 60 75 Q 70 60 65 40" stroke="white" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.9" clip-path="url(#circle)"/>
  <path d="M 45 115 Q 50 90 60 75 Q 70 60 65 40" stroke="#F0F8FF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6" clip-path="url(#circle)"/>

  <!-- Wave overlays on water -->
  <path d="M 10 88 Q 30 82 50 88 Q 70 94 90 88 Q 100 84 115 88" stroke="white" stroke-width="1.5" fill="none" opacity="0.4" clip-path="url(#circle)"/>
  <path d="M 10 96 Q 35 90 55 96 Q 75 102 95 96 Q 108 92 115 96" stroke="white" stroke-width="1.5" fill="none" opacity="0.3" clip-path="url(#circle)"/>

  <!-- Outer ring accent -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>
  <circle cx="60" cy="60" r="58" fill="none" stroke="#0A2463" stroke-width="4"/>
</svg>
